[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dealscour"
version = "0.1.0"
description = "Personal grocery basket planner: split orders to capture threshold offers."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn>=0.30",
  "sqlmodel>=0.0.22",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]

[[tool.mypy.overrides]]
module = ["app.core.*", "app.pricing.*", "app.optimizer.*"]
strict = true
