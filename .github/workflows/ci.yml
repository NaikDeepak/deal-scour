name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dealscour:ci .
      - name: Boot and smoke-test
        run: |
          docker run -d --name ds -p 8000:8000 dealscour:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/v1/health && break; sleep 1; done
          curl -fsS localhost:8000/ | grep -qi "<html"
          curl -fsS -X POST localhost:8000/api/v1/lists -H 'content-type: application/json' -d '{"name":"CI","kind":"quick"}'
          curl -fsS localhost:8000/api/v1/lists | grep -q '"CI"'
          docker logs ds | tail -20
