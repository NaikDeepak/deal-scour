<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DealScour Extension Options</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 480px;
        margin: 24px auto;
        padding: 0 16px;
        color: #0f172a;
        background: #f8fafc;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
        color: #475569;
      }
      select, input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        margin-bottom: 12px;
        font-size: 13px;
      }
      button {
        background: #0f172a;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .status {
        font-size: 12px;
        color: #047857;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>DealScour Deal Radar</h1>
      <p id="ext-version" style="font-size: 12px; color: #64748b; margin: 0 0 8px;">DealScour extension v0.3.0</p>
      <p id="connection-state" style="font-size: 13px; color: #475569;">Checking status…</p>
      <label for="api-origin">DealScour Server Origin</label>
      <select id="api-origin">
        <option value="http://localhost:8000">http://localhost:8000</option>
        <option value="http://127.0.0.1:8000">http://127.0.0.1:8000</option>
      </select>
      <button id="save-btn" type="button">Save Settings</button>
      <button id="disconnect-btn" type="button" style="background: #be123c; margin-left: 8px;">Disconnect</button>
      <div id="status-msg" class="status"></div>
    </div>
    <script src="lib.js"></script>
    <script src="options.js"></script>
  </body>
</html>
